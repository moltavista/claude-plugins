name: Sync marketplace from Forgejo

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marketplace-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward to the public Forgejo source
        shell: bash
        env:
          FORGEJO_READ_KEY: ${{ secrets.FORGEJO_READ_KEY }}
        run: |
          set -euo pipefail
          test -n "$FORGEJO_READ_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$FORGEJO_READ_KEY" > "$HOME/.ssh/forgejo_read_key"
          chmod 600 "$HOME/.ssh/forgejo_read_key"
          cp .github/forgejo_known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          git remote add forgejo ssh://git@git.teixos.net/moltavista/claude-plugins.git
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/forgejo_read_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" git fetch forgejo main --tags
          current="$(git rev-parse HEAD)"
          source="$(git rev-parse FETCH_HEAD)"
          if [ "$current" != "$source" ]; then
            git merge-base --is-ancestor "$current" "$source" || {
              echo "GitHub main diverged from Forgejo main; refusing to force-push" >&2
              exit 1
            }
            git push origin "$source:refs/heads/main"
          fi
          git push origin --tags
